name: Apply portfolio assets
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch bundles
        run: |
          B="https://github.com/${{ github.repository }}/releases/download/assets-2026-11-23"
          curl -fsSL "$B/16-part1.zip" -o part1.zip
          curl -fsSL "$B/17-part2.zip" -o part2.zip
          curl -fsSL "$B/18-part3.zip" -o part3.zip
      - name: Unpack
        run: |
          unzip -o part1.zip
          unzip -o part2.zip
          unzip -o part3.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply portfolio assets and content (via release bundle)" || echo "nothing to commit"
          git push
