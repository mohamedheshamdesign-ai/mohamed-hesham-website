name: Publish supplied portfolio presentations
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed portfolio bundle
        run: |
          curl -fL 'https://github.com/mohamedheshamdesign-ai/mohamed-hesham-website/releases/download/portfolio-remaining-20261123/1-remaining-1.zip' -o /tmp/remaining-1.zip
          curl -fL 'https://github.com/mohamedheshamdesign-ai/mohamed-hesham-website/releases/download/portfolio-remaining-20261123/2-remaining-2.zip' -o /tmp/remaining-2.zip
          unzip -oq /tmp/remaining-1.zip -d .
          unzip -oq /tmp/remaining-2.zip -d .
          git config user.name 'mohamedheshamdesign-ai'
          git config user.email 'mohamedheshamdesign-ai@users.noreply.github.com'
          git add content/works public/projects
          git commit -m 'Publish remaining supplied portfolio presentations'
          git push
