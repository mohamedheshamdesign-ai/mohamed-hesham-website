name: Apply portfolio fixes
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch bundle
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/assets-fix-2026-11-23/1-fix.zip" -o fix.zip
      - name: Unpack
        run: |
          unzip -o fix.zip
          rm fix.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish covers and copy for Alitalia, Crowd, Onvaca, Virginia" || echo "nothing to commit"
          git push
