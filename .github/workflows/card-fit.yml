name: Apply proportional card fill and homepage count sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed fix bundle
        run: |
          curl -fL 'https://github.com/mohamedheshamdesign-ai/mohamed-hesham-website/releases/download/card-fit-20261123/card-fit-fix.zip' -o /tmp/card-fit-fix.zip
          unzip -oq /tmp/card-fit-fix.zip -d .
          git config user.name 'mohamedheshamdesign-ai'
          git config user.email 'mohamedheshamdesign-ai@users.noreply.github.com'
          git add app/globals.css app/page.tsx
          git commit -m 'Fill project cards proportionally and sync homepage counts with Work data'
          git push
